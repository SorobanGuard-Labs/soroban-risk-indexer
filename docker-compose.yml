version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soroban-risk-indexer
    ports:
      - "${PORT:-4100}:${PORT:-4100}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-4100}
      - NODE_ENV=${NODE_ENV:-production}
      - SOROBAN_RISK_INDEXER_MOCK_MODE=${SOROBAN_RISK_INDEXER_MOCK_MODE:-true}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped