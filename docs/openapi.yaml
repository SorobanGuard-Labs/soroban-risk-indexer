openapi: 3.0.3
info:
  title: Soroban Risk Indexer API
  description: >-
    Open-source backend API from SorobanGuard Labs for indexing Soroban project risk,
    audit readiness, security tasks, and test evidence.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4100
    description: Local development server
  - url: https://api.sorobanguard.io
    description: Production environment

paths:
  /health:
    get:
      summary: Service health check
      description: Returns service availability status and service identifier.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /projects:
    get:
      summary: List indexed projects
      description: Returns list of indexed Soroban projects with readiness and risk scores.
      operationId: listProjects
      responses:
        '200':
          description: List of projects retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'

  /risks:
    get:
      summary: List indexed risks
      description: Returns list of contract, architectural, and operational risks.
      operationId: listRisks
      responses:
        '200':
          description: List of risks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Risk'

  /findings:
    get:
      summary: List audit findings
      description: Returns list of security audit findings across indexed projects.
      operationId: listFindings
      responses:
        '200':
          description: List of findings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Finding'

  /tasks:
    get:
      summary: List security tasks
      description: Returns contributor tasks generated by Soroban Guard Kit or manual checklists.
      operationId: listTasks
      responses:
        '200':
          description: List of tasks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'

  /test-results:
    get:
      summary: List test and simulation results
      description: Returns test results and Soroban Testbench transaction / RPC failure simulations.
      operationId: listTestResults
      parameters:
        - name: status
          in: query
          description: Filter by execution status
          required: false
          schema:
            type: string
            enum: [passed, failed, skipped]
        - name: projectId
          in: query
          description: Filter by project identifier
          required: false
          schema:
            type: string
        - name: simulationType
          in: query
          description: Filter by Soroban Testbench simulation type
          required: false
          schema:
            type: string
            enum:
              - transaction_simulation
              - rpc_failure
              - auth_boundary
              - budget_exhaustion
              - storage_footprint
      responses:
        '200':
          description: List of test results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TestResult'

  /index/mock:
    post:
      summary: Trigger deterministic mock indexing
      description: Reloads mock adapter data into storage and recomputes readiness scores.
      operationId: indexMock
      responses:
        '202':
          description: Mock data indexed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/MockIndexResponse'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: soroban-risk-indexer

    Project:
      type: object
      required:
        - id
        - name
        - repositoryUrl
        - network
        - readinessScore
        - riskScore
      properties:
        id:
          type: string
          example: project-phoenix-vault
        name:
          type: string
          example: Phoenix Vault
        repositoryUrl:
          type: string
          example: https://github.com/sorobanguard-labs/phoenix-vault
        network:
          type: string
          enum: [local, testnet, futurenet, mainnet]
          example: testnet
        readinessScore:
          type: number
          description: Audit readiness score (0-100)
          example: 85
        riskScore:
          type: number
          description: Aggregated risk score (0-100)
          example: 25

    Risk:
      type: object
      required:
        - id
        - projectId
        - title
        - severity
        - category
        - description
        - recommendation
        - status
      properties:
        id:
          type: string
          example: risk-001
        projectId:
          type: string
          example: project-phoenix-vault
        title:
          type: string
          example: Missing authorization guard on admin path
        severity:
          type: string
          enum: [critical, high, medium, low, informational]
          example: high
        category:
          type: string
          example: access-control
        description:
          type: string
          example: A privileged operation is documented but not represented in the readiness checklist.
        recommendation:
          type: string
          example: Require explicit admin authorization tests before promoting the contract.
        status:
          type: string
          enum: [open, accepted, mitigated, closed]
          example: open

    Finding:
      type: object
      required:
        - id
        - projectId
        - severity
        - summary
        - affectedArea
        - recommendation
        - status
      properties:
        id:
          type: string
          example: finding-001
        projectId:
          type: string
          example: project-phoenix-vault
        severity:
          type: string
          enum: [critical, high, medium, low, informational]
          example: medium
        summary:
          type: string
          example: Boundary test missing for minimum deposit
        affectedArea:
          type: string
          example: deposit validation
        recommendation:
          type: string
          example: Add minimum and zero-value deposit tests.
        status:
          type: string
          enum: [open, triaged, resolved]
          example: triaged

    Task:
      type: object
      required:
        - id
        - projectId
        - title
        - labels
        - difficulty
        - acceptanceCriteria
        - status
      properties:
        id:
          type: string
          example: task-001
        projectId:
          type: string
          example: project-phoenix-vault
        title:
          type: string
          example: Add admin authorization regression tests
        labels:
          type: array
          items:
            type: string
          example: ["security", "authorization", "guard-kit"]
        difficulty:
          type: string
          enum: [easy, medium, hard]
          example: medium
        acceptanceCriteria:
          type: array
          items:
            type: string
          example: ["Admin-only functions have negative authorization tests"]
        status:
          type: string
          enum: [todo, in-progress, done, blocked]
          example: in-progress
        source:
          type: string
          enum: [guard-kit, manual, github]
          example: guard-kit
        category:
          type: string
          enum: [authorization, data-storage, upgradeability, resource-budget, readiness, resilience]
          example: authorization

    TestResult:
      type: object
      required:
        - id
        - projectId
        - scenario
        - status
        - durationMs
        - timestamp
      properties:
        id:
          type: string
          example: test-result-001
        projectId:
          type: string
          example: project-phoenix-vault
        scenario:
          type: string
          example: admin unauthorized deposit freeze
        status:
          type: string
          enum: [passed, failed, skipped]
          example: passed
        durationMs:
          type: integer
          example: 128
        failureReason:
          type: string
          example: Submission retry policy was not configured in mock mode.
        timestamp:
          type: string
          format: date-time
          example: '2026-11-09T03:00:00.000Z'
        simulationType:
          type: string
          enum:
            - transaction_simulation
            - rpc_failure
            - auth_boundary
            - budget_exhaustion
            - storage_footprint
          example: auth_boundary
        rpcDetails:
          $ref: '#/components/schemas/TestbenchRpcDetails'

    TestbenchRpcDetails:
      type: object
      properties:
        endpoint:
          type: string
          example: https://soroban-testnet.stellar.org
        rpcError:
          type: string
          example: GatewayTimeout (504)
        retryAttempts:
          type: integer
          example: 3
        transient:
          type: boolean
          example: true

    MockIndexResponse:
      type: object
      required:
        - projectCount
        - riskCount
        - findingCount
        - taskCount
        - testResultCount
      properties:
        projectCount:
          type: integer
          example: 2
        riskCount:
          type: integer
          example: 3
        findingCount:
          type: integer
          example: 2
        taskCount:
          type: integer
          example: 3
        testResultCount:
          type: integer
          example: 2

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Route not found
